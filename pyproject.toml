[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-video"
version = "0.1.0"
description = "Real-time 24-bit TrueColor ASCII video playback engine in the terminal"
readme = "ascii_video/README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "colorama>=0.4.0",
]

[project.scripts]
ascii-video = "ascii_video.cli:main"

[tool.pytest.ini_options]
testpaths = ["ascii_video/tests"]
python_files = ["test_*.py"]
